<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0A4B52">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIP Pause Check | FinLit AI Co-pilot Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#E6EFEC;--paper:#FBFDFC;--ink:#0B2A2F;--mute:#5A7176;--line:#D6E3E0;--teal:#0A4B52;--teal2:#16787F;--mint:#DDEFEA;--sf:#F0A030;--sfbg:#FFF0D5;--sfink:#6E4306;--red:#C0432F;--redbg:#FBE4DF;--green:#1D7A52;--greenbg:#DDF1E6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 'DM Sans',system-ui,sans-serif;min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:12px;font-variant-numeric:tabular-nums}
h1,h2,h3,.hd{font-family:'Sora','DM Sans',system-ui,sans-serif;margin:0;line-height:1.2;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sf);outline-offset:2px}
.wrap{width:100%;display:flex;justify-content:center}
.phone{position:relative;width:100%;max-width:392px;height:800px;max-height:calc(100dvh - 24px);background:var(--paper);border:9px solid #10262A;border-radius:44px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(8,40,44,.28)}
#app{flex:1;overflow-y:auto;scrollbar-width:none}#app::-webkit-scrollbar{display:none}
.pad{padding:calc(18px + env(safe-area-inset-top,0px)) 20px 18px}
.hero{background:var(--teal);color:#fff;padding:calc(22px + env(safe-area-inset-top,0px)) 20px 26px;border-radius:0 0 30px 30px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.hero .big{font:700 32px/1.1 'Sora',sans-serif;margin:4px 0}
.pill{display:inline-block;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;background:var(--sf);color:#3A2203}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.chip.ok{background:var(--greenbg);color:var(--green)}.chip.warn{background:var(--sfbg);color:var(--sfink)}.chip.bad{background:var(--redbg);color:var(--red)}
.mute{color:var(--mute);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sip{padding:14px 0;border-bottom:1px solid var(--line)}
.shield{display:inline-block;font-size:12px;font-weight:600;color:var(--teal2);margin-top:3px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-weight:600;background:var(--teal);color:#fff;margin-top:10px}
.btn.alt{background:none;border:1.5px solid var(--teal);color:var(--teal)}
.btn.sm{width:auto;display:inline-block;padding:8px 14px;font-size:14px;margin:0}
.link{display:block;margin:10px auto 0;background:none;border:0;color:var(--mute);text-decoration:underline;padding:6px}
.back{background:none;border:0;color:var(--teal2);font-weight:600;padding:0 0 8px}
.alert{background:var(--sfbg);border-radius:18px;padding:16px;margin-bottom:16px}
.alert h2{font-size:20px;color:var(--sfink)}.alert p{margin:6px 0 0;color:var(--sfink);font-size:14px}
.sec{padding:14px 0;border-top:1px solid var(--line)}.sec h3{font-size:16px;margin-bottom:6px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.stat{border-left:4px solid var(--teal);padding:2px 0 2px 10px}.stat.x{border-color:var(--red)}
.stat b{font:700 18px 'Sora',sans-serif;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.pick{border:1.5px solid var(--line);background:none;border-radius:999px;padding:8px 13px;font-size:14px}
.pick[aria-pressed="true"]{border-color:var(--teal);background:var(--mint);font-weight:600}
.reply{background:var(--mint);border-radius:14px;padding:12px 14px;font-size:14px;animation:fade .3s ease-out}
details summary{cursor:pointer;font-weight:600;color:var(--teal2)}
.sticky{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 20px calc(14px + env(safe-area-inset-bottom,0px))}
.opt{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0}
.opt i{width:14px;height:14px;border-radius:50%;display:block}
.opt[aria-checked="true"]{background:var(--mint);margin:0 -20px;padding:12px 20px;width:calc(100% + 40px)}
.rng{width:100%;accent-color:var(--teal)}
.tick{width:68px;height:68px;border-radius:50%;background:var(--greenbg);color:var(--green);display:grid;place-items:center;font-size:34px;margin:6px auto 14px;animation:pop .4s ease-out}
.rcpt{border:1.5px dashed var(--line);border-radius:16px;padding:14px;margin:16px 0}
.rcpt .row{padding:4px 0;font-size:14px}
.scrim{position:absolute;inset:0;background:rgba(8,30,34,.5);animation:fade .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:28px 28px 0 0;padding:20px 20px 24px;animation:up .32s cubic-bezier(.2,.8,.2,1)}
.sheet h2{font-size:21px}
svg text{fill:var(--mute);font:11px 'DM Sans',sans-serif}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes up{from{transform:translateY(100%)}to{transform:none}}@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.status{display:flex;justify-content:space-between;padding:10px 24px 4px;font:600 12px 'Sora',sans-serif;background:var(--paper);z-index:2}
.phone.hero-on .status{background:var(--teal);color:#fff}
.seg{display:flex;gap:6px}.seg button{flex:1;border:1.5px solid var(--line);background:none;border-radius:12px;padding:7px 4px;font-size:13px;line-height:1.25}
.seg button[aria-pressed="true"]{border-color:var(--teal);background:var(--mint)}
.insight{background:var(--mint);border-radius:14px;padding:12px 14px;border-left:4px solid var(--teal)}.insight p{margin:4px 0 0;font-size:14px}
.tag{display:inline-block;background:var(--teal);color:#fff;border-radius:6px;padding:0 7px;font-size:11.5px;font-weight:600}
@media (max-width:600px){body{padding:0}.phone{max-height:none;height:100dvh;border:0;border-radius:0}.status{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <main class="phone" id="phone">
    <div class="status"><span>9:41</span><span>5G 88%</span></div>
    <div id="app" aria-live="polite"></div><div id="layer"></div>
 </main>
</div>
<script>
const LOW=.07,MID=.095,HIGH=.12;
const PERS=[
{n:'Rohan',age:28,goal:'House down payment',t:2200000,c:600000,y:6,s:15000,fund:'Nifty 50 Index Fund',inst:22,val:'₹6,92,400',inv:'₹6,10,000',fit:'continue',tag:'Long horizon',note:'You have 6 years left. A fall this size counts for less over a long horizon than it feels today, so the main risk is stopping at the low point.'},
{n:'Meera',age:41,goal:"Daughter's college fund",t:3800000,c:2100000,y:3,s:25000,fund:'Flexi Cap Fund',inst:38,val:'₹24,80,000',inv:'₹20,10,000',fit:'continue',tag:'Short horizon',note:'Only 3 years remain, so a fall counts for more and every paused month costs you more. This is also a good time to review how much of this goal sits in equity.'},
{n:'Arjun',age:33,goal:'Wedding fund',t:900000,c:300000,y:4,s:10000,fund:'Nifty 50 Index Fund',inst:14,val:'₹3,45,000',inv:'₹3,02,000',fit:'reduce',tag:'Cash is tight',note:'Your emergency buffer covers about 2 months, so wanting to pause for cash is a real need. Reducing the SIP eases monthly pressure and keeps more of your goal than stopping.'}];
let P,TARGET,C0,NM;
function setP(i){P=PERS[i];TARGET=P.t;C0=P.c;NM=P.y*12}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const INIT={s:1,action:'pause',reason:null,choice:'pause',pm:3,sheet:false,fb:null};
let S={...INIT},prev=0,EV=[];
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN'),L=v=>(v/1e5).toFixed(1);
const resume=()=>'10 '+MON[(9+S.pm)%12];
const O=()=>({
 continue:{t:'Keep SIP at '+inr(P.s),d:'No change to your plan',p:P.s,z:0,c:'#0A4B52'},
 reduce:{t:'Reduce SIP to '+inr(P.s/2),d:'Half the amount, no end date',p:P.s/2,z:0,c:'#5FA8A0'},
 pause:{t:`Pause for ${S.pm} months`,d:`Auto-resumes on ${resume()}`,p:P.s,z:S.pm,c:'#F0A030'},
 stop:{t:'Stop SIP',d:'No future debits',p:0,z:0,c:'#C0432F'}});
function series(o,r){let v=C0;const a=[v];for(let m=1;m<=NM;m++){v=v*(1+r/12)+(m<=o.z?0:o.p);a.push(v)}return a}
const end=(k,r)=>series(O()[k],r)[NM];
const rng=k=>[end(k,LOW),end(k,HIGH)];
const stat=k=>{const[l,h]=rng(k);return l>=TARGET?['On track','ok']:h>=TARGET?['Within reach','warn']:['Likely short','bad']};
const VERB={pause:'pause',reduce:'reduce',cancel:'cancel'},ANY={pause:'Pause anyway',reduce:'Reduce anyway',cancel:'Cancel anyway'};
const DONE={
 continue:()=>['Your SIP stays active',inr(P.s)+' will be debited on 10 Oct as planned.'],
 reduce:()=>['SIP reduced to '+inr(P.s/2),'The new amount applies from the 10 Oct debit. You can raise it anytime.'],
 pause:()=>[`SIP paused for ${S.pm} months`,`Debits skip until ${resume()}. We will remind you 7 days before it resumes.`],
 hold:['SIP paused','Debits are on hold until you resume. We will check in with you in 30 days.'],
 stop:['SIP cancelled','No more debits. Your existing units stay invested and you can restart anytime.']};
const REPLY={scary:'Feeling uneasy during a fall is normal. An SIP buys more units when prices are lower, which is what it is built for. If you still want a break, a timed pause is safer than stopping.',cash:'If cash is the issue, reducing the SIP keeps your goal closer than stopping it. Check your emergency fund first. Six months of expenses is a common rule of thumb.',move:'Check that the new investment fits your goal and horizon. You can reduce this SIP while you decide instead of stopping it.',unsure:'Not being sure is a good reason to wait. Keep the SIP running now and review it after the next debit.'};
const log=(n,p)=>{EV.unshift(n+(p?'  '+p:''));EV=EV.slice(0,6);console.log('[analytics]',n,p||'')};

function home(){const pct=Math.round(C0/TARGET*100),c=213.6*(1-pct/100),[st,cl]=stat('continue');return `
<div class="hero"><div><div style="opacity:.8;font-size:13px">${P.n}'s portfolio</div><div class="big">${P.val}</div>
<div style="opacity:.8;font-size:13px;margin-bottom:10px">Invested ${P.inv}</div><span class="pill">Nifty 50 is 9% below its peak</span></div>
<svg width="92" height="92" viewBox="0 0 92 92" role="img" aria-label="Goal ${pct}% funded"><circle cx="46" cy="46" r="34" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="9"/>
<circle cx="46" cy="46" r="34" fill="none" stroke="#F0A030" stroke-width="9" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="${c}" transform="rotate(-90 46 46)"/>
<text x="46" y="44" text-anchor="middle" style="fill:#fff;font:700 15px Sora">${pct}%</text><text x="46" y="58" text-anchor="middle" style="fill:#cfe6e3;font-size:10px">of goal</text></svg></div>
<div class="pad"><div class="mute" style="margin-bottom:6px">Demo: switch investor</div>
<div class="seg" role="group" aria-label="Switch investor">${PERS.map((p,i)=>`<button data-persona="${i}" aria-pressed="${p===P}"><b>${p.n}, ${p.age}</b><br><span class="mute">${p.y} years to goal</span></button>`).join('')}</div>
<div class="row" style="margin-top:20px"><b class="hd">${P.goal}</b><span class="chip ${cl}">${st}</span></div>
<div class="mute">${inr(TARGET)} by ${2026+P.y}, if your SIPs continue</div>
<h3 style="margin:20px 0 2px;font-size:17px">Your SIPs</h3>
<div class="sip row"><div><b>${P.fund}</b><div class="mute">${inr(P.s)} monthly, next debit 10 Oct</div><span class="shield">Pause Check is on</span></div><button class="btn sm alt" data-go="2">Manage</button></div>
<div class="sip"><b>Short Duration Debt Fund</b><div class="mute">₹5,000 monthly, next debit 12 Oct</div></div>
<p class="mute" style="margin-top:16px">Prototype with illustrative data. Not investment advice.</p></div>`}

function detail(){return `<div class="pad"><button class="back" data-go="1">Back</button>
<h2 style="font-size:24px">${P.fund}</h2><div class="mute" style="margin-bottom:14px">Linked goal: ${P.goal}</div>
<div class="sip row" style="border-top:1px solid var(--line)"><span class="mute">Monthly amount</span><b>${inr(P.s)}</b></div>
<div class="sip row"><span class="mute">Installments done</span><b>${P.inst}</b></div>
<div class="sip row"><span class="mute">Next debit</span><b>10 Oct</b></div>
<h3 style="margin:20px 0 2px;font-size:17px">Change this SIP</h3>
<button class="btn alt" data-act="pause">Pause SIP</button><button class="btn alt" data-act="reduce">Reduce amount</button><button class="btn alt" data-act="cancel">Cancel SIP</button></div>`}

function sheet(){return `<div class="scrim" data-close="1"></div><div class="sheet" role="dialog" aria-label="Quick check"><h2>Quick check before you ${VERB[S.action]}</h2>
<p class="mute" style="font-size:14px;margin:8px 0 4px">The market is down 9% and this SIP supports your goal. Take 60 seconds to see what ${VERB[S.action]==='pause'?'pausing':VERB[S.action]==='reduce'?'reducing':'cancelling'} means for it. You can still go ahead after.</p>
<button class="btn" data-start="1">Start 60-second check</button><button class="link" data-close="1">Keep my SIP for now</button></div>`}

function intervene(){const[cl,ch]=rng('continue'),[sl,sh]=rng('stop');return `<div class="pad" style="padding-bottom:6px"><button class="back" data-go="2">Back</button>
<div class="alert"><h2>Before you ${VERB[S.action]}, take 60 seconds</h2><p>The decision stays yours. This is information to help you choose, not advice.</p></div>
<div class="sec" style="border:0;padding-top:0"><h3>What is happening</h3>
<svg viewBox="0 0 300 74" width="100%" role="img" aria-label="Index is 9% below its peak"><polyline points="0,52 30,46 60,40 90,32 120,26 150,20 170,14 190,22 215,36 240,47 270,54 300,50" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-linejoin="round"/><circle cx="170" cy="14" r="4" fill="var(--teal)"/><circle cx="300" cy="50" r="4.5" fill="var(--red)"/><text x="150" y="9">Peak</text><text x="228" y="72">Today, down 9%</text></svg>
<p style="margin:4px 0 0;font-size:14px">Falls like this have happened before and recoveries took different amounts of time. None were guaranteed.</p></div>
<div class="sec"><h3>What it means for your goal</h3><div class="mute">Projected value in ${P.y} years against ${inr(TARGET)}</div>
<div class="duo"><div class="stat"><b>₹${L(cl)}–${L(ch)}L</b><span class="mute">if this SIP continues</span></div><div class="stat x"><b>₹${L(sl)}–${L(sh)}L</b><span class="mute">if it stops</span></div></div></div>
<div class="sec"><div class="insight"><b class="hd">${P.tag}</b><p>${P.note}</p></div></div>
<div class="sec"><h3>What is behind this?</h3><div class="chips">${[['scary','Markets look scary'],['cash','I need cash now'],['move','Moving money elsewhere'],['unsure','Not sure']].map(([k,t])=>`<button class="pick" data-reason="${k}" aria-pressed="${S.reason===k}">${t}</button>`).join('')}</div>
${S.reason?`<div class="reply">${REPLY[S.reason]}</div>`:''}</div>
<div class="sec"><details><summary>Why am I seeing this?</summary><ul class="mute" style="padding-left:18px;margin:8px 0"><li>Your goal and ${P.y} year horizon</li><li>Your moderate risk profile</li><li>The current 9% market fall</li><li>${P.inst} installments already made</li><li>Assumes 7% to 12% yearly returns, before tax and costs</li></ul>
<p class="mute" style="margin:0">Every number comes from a calculation engine. The AI only explains those numbers and never recommends funds.</p></details></div></div>
<div class="sticky"><button class="btn" style="margin-top:0" data-final="continue">Keep my SIP</button><button class="btn alt" data-go="4">Compare my options</button>
<button class="link" data-final="${{pause:'hold',reduce:'reduce',cancel:'stop'}[S.action]}">${ANY[S.action]}</button></div>`}

function chart(){const o=O(),X=m=>30+m/NM*300,mx=Math.ceil(Math.max(...Object.keys(o).map(k=>end(k,HIGH)))/5e5)*5e5,Y=v=>160-Math.min(v,mx)/mx*150,sel=S.choice;
 const path=a=>a.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('');
 const lo=series(o[sel],LOW),hi=series(o[sel],HIGH),band=path(hi)+lo.map((v,i)=>'L'+X(NM-i).toFixed(1)+' '+Y(lo[NM-i]).toFixed(1)).join('')+'Z';
 return `<svg viewBox="0 0 340 186" width="100%" role="img" aria-label="Projected goal value for each option">
 ${[1,2,3].map(g=>`<line x1="30" x2="330" y1="${Y(mx*g/3)}" y2="${Y(mx*g/3)}" stroke="var(--line)"/><text x="2" y="${Y(mx*g/3)+4}">₹${L(mx*g/3)}L</text>`).join('')}
 <path d="${band}" fill="${o[sel].c}" opacity=".18"/>
 ${Object.keys(o).map(k=>`<path d="${path(series(o[k],MID))}" fill="none" stroke="${o[k].c}" stroke-width="${k===sel?3.5:1.5}" opacity="${k===sel?1:.45}" stroke-linejoin="round"/>`).join('')}
 <line x1="30" x2="330" y1="${Y(TARGET)}" y2="${Y(TARGET)}" stroke="var(--red)" stroke-dasharray="5 4"/><text x="34" y="${Y(TARGET)-5}" style="fill:var(--red)">Goal ${inr(TARGET)}</text>
 <text x="30" y="180">Now</text><text x="165" y="180">${Math.round(2026+P.y/2)}</text><text x="298" y="180">${2026+P.y}</text></svg>`}
function rows(){const o=O();return Object.keys(o).map(k=>{const[l,h]=rng(k),[st,c]=stat(k);return `<button class="opt" role="radio" aria-checked="${S.choice===k}" data-choice="${k}"><i style="background:${o[k].c}"></i><span><b>${o[k].t}</b><br><span class="mute">${o[k].d}. ₹${L(l)}–${L(h)} lakh</span>${k===P.fit?' <span class="tag">Fits your inputs</span>':''}</span><span class="chip ${c}">${st}</span></button>`}).join('')}
function options(){return `<div class="pad" style="padding-bottom:6px"><button class="back" data-go="3">Back</button><h2 style="font-size:22px">Compare your options</h2>
<p class="mute" style="margin:4px 0 8px">Projected value for your goal in ${P.y} years. The shaded band shows the range for the option you pick.</p>
<div id="cb">${chart()}</div>
<div style="margin:6px 0 12px"><label class="mute" for="pm"><b>If you pause, for how long?</b> <span id="pml">${S.pm} months</span></label><input class="rng" id="pm" type="range" min="1" max="12" value="${S.pm}"></div>
<div role="radiogroup" aria-label="SIP options" id="rw">${rows()}</div>
<p class="mute" style="margin-top:12px">Illustrative projections at 7% to 12% yearly returns, with the line at 9.5%. Returns are not guaranteed.</p></div>
<div class="sticky"><button class="btn" style="margin-top:0" data-final="${S.choice}">Confirm choice</button></div>`}

function done(){const d=DONE[S.choice],[t,b]=typeof d==='function'?d():d;return `<div class="pad"><div class="tick" aria-hidden="true">✓</div>
<h2 style="font-size:24px;text-align:center">${t}</h2><p class="mute" style="text-align:center;font-size:14px">${b}</p>
<div class="rcpt"><b class="hd" style="font-size:14px">Decision receipt</b>
<div class="row"><span class="mute">Reviewed</span><span>Market, goal, 4 options</span></div>
<div class="row"><span class="mute">Reason shared</span><span>${S.reason?{scary:'Markets look scary',cash:'Need cash',move:'Moving money',unsure:'Not sure'}[S.reason]:'Not shared'}</span></div>
<div class="row"><span class="mute">Reference</span><span>PC-2610-0087</span></div>
<div class="row"><span class="mute">Change anytime</span><span>Yes</span></div></div>
<b class="hd" style="font-size:14px">Was this check useful?</b>
<div class="chips">${[['yes','Yes'],['no','Not really']].map(([k,t])=>`<button class="pick" data-fb="${k}" aria-pressed="${S.fb===k}">${t}</button>`).join('')}</div>
${S.fb?'<div class="reply">Thanks. Your feedback helps us tune when we show this check.</div>':''}
<button class="btn" data-go="1">Back to home</button><button class="link" data-reset="1">Restart demo</button></div>`}

const SCR=[home,detail,intervene,options,done];
function render(){const a=document.getElementById('app');a.innerHTML=SCR[S.s-1]();
 if(prev!==S.s){a.scrollTop=0;prev=S.s}
 document.getElementById('phone').classList.toggle('hero-on',S.s===1);
 document.getElementById('layer').innerHTML=S.sheet&&S.s===2?sheet():'';
 const sl=document.getElementById('pm');if(sl)sl.oninput=()=>{S.pm=+sl.value;document.getElementById('pml').textContent=S.pm+' months';document.getElementById('cb').innerHTML=chart();document.getElementById('rw').innerHTML=rows()}}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-go],[data-act],[data-start],[data-close],[data-reason],[data-choice],[data-final],[data-fb],[data-reset],[data-persona]');if(!t)return;const d=t.dataset;
 if(d.persona){setP(+d.persona);S={...INIT};EV=[];log('persona_switched',PERS[+d.persona].n)}
 else if(d.reset){S={...INIT};EV=[]}
 else if(d.act){S.action=d.act;S.reason=null;S.choice={pause:'pause',reduce:'reduce',cancel:'stop'}[d.act];S.sheet=true;log('sip_change_tapped','action='+d.act)}
 else if(d.start){S.sheet=false;S.s=3;log('check_viewed')}
 else if(d.close){S.sheet=false;log('check_dismissed')}
 else if(d.reason){S.reason=d.reason;log('reason_selected',d.reason)}
 else if(d.choice){S.choice=d.choice;log('option_selected',d.choice)}
